services:
  outreach-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: outreach-notion-auto:latest
    container_name: outreach-notion-auto
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NOTION_AUTH_DIR: /app/auth
      NOTION_ACCOUNT: ${NOTION_ACCOUNT:-default}
      ARTIFACT_DIR: artifacts
      PLAYWRIGHT_HEADLESS: "true"
      WORKER_ID: ${WORKER_ID:-worker-docker-1}
      TZ: Asia/Shanghai
      TMPDIR: /app/.playwright-tmp
      TEMP: /app/.playwright-tmp
      TMP: /app/.playwright-tmp
    volumes:
      - ./auth:/app/auth
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./log:/app/log
      - ./.playwright-tmp:/app/.playwright-tmp
    shm_size: "2gb"
    init: true
